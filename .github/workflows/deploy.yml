name: Deploy CareRoute to Azure

on:
  push:
    branches: [main]      # every push to main triggers this
  workflow_dispatch:      # ...and you can also run it by hand

permissions:
  id-token: write         # lets the job get the OIDC token for Azure login
  contents: read

env:
  RESOURCE_GROUP: careroute-rg
  ACR_NAME: carerouteacr
  CONTAINER_APP: careroute-app
  IMAGE_NAME: careroute

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (the gate)
        run: python test_agent_langgraph.py

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get the real registry login server
        run: echo "ACR_LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)" >> "$GITHUB_ENV"

      - name: Build the image in ACR, tagged with this commit
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Deploy the new image to Container Apps
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars GIT_SHA=${{ github.sha }}

      - name: Smoke test the live app
        run: |
          FQDN=$(az containerapp show -n ${{ env.CONTAINER_APP }} -g ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Testing https://$FQDN ..."

          # 1) /version must report the commit we just deployed (not a stale image).
          #    The first hit may cold-start the container, so retry.
          OK=""
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsS --max-time 20 "https://$FQDN/version" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"commit":"${{ github.sha }}"'; then
              echo "version ok"; OK=1; break
            fi
            echo "waiting for the new revision to go live (attempt $i)..."; sleep 15
          done
          if [ -z "$OK" ]; then
            echo "Smoke test FAILED: /version never reported ${{ github.sha }}"; exit 1
          fi

          # 2) /care must return an answer. The FIRST call after a fresh deploy is
          #    slow: cold container + uncached Overpass/OSRM + several LLM calls can
          #    exceed a minute. Allow a generous per-try timeout and retry — the
          #    first try warms the OSM cache (the server finishes and caches even if
          #    curl gives up), so a later try is fast. || true keeps a timeout from
          #    tripping `set -e` before we can check the result.
          CARE_OK=""
          for i in 1 2 3; do
            RESP=$(curl -fsS --max-time 90 -X POST "https://$FQDN/care" \
              -H "Content-Type: application/json" \
              -d '{"symptoms":"itchy fingers","lat":12.9719,"lng":77.6412}' || true)
            if echo "$RESP" | grep -qi '"answer"'; then
              echo "$RESP"; CARE_OK=1; break
            fi
            echo "care attempt $i returned no answer yet, retrying..."; sleep 5
          done
          if [ -z "$CARE_OK" ]; then
            echo "Smoke test FAILED: /care returned no answer after retries"; exit 1
          fi
          echo "Smoke test passed."