# Round-robin across every app replica. Docker's DNS returns one address per
# replica; `resolver` + a variable makes nginx re-resolve, so replicas added
# with `--scale` or restarted with new IPs are picked up without a reload.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    location / {
        set $app http://app:8000;
        proxy_pass $app;
        proxy_set_header Host $host;
        # The app rate-limits by the left-most X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        # An agent turn can take a while (several LLM calls).
        proxy_read_timeout 120s;
        # Which replica answered — handy to SEE requests hopping replicas.
        add_header X-Served-By $upstream_addr always;
    }
}
