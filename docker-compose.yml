# Run CareRoute as N stateless replicas on your laptop, behind a load balancer.
#
#   docker compose up --build --scale app=3
#   open http://localhost:8000
#
# nginx round-robins every request across the replicas, so consecutive turns of
# one conversation usually land on DIFFERENT replicas — the exact situation
# that broke the in-memory design. Try `docker compose kill app` on one
# replica mid-conversation: the chat carries on.
#
# Map data is self-hosted (step 2): providers come from PostGIS, road distance
# from a local OSRM, geocoding from a local Nominatim, all built from the same
# Karnataka OSM extract. One-time setup (see README "Self-hosted map data"):
#   docker compose --profile geo-setup run --rm geo-fetch    # download + clip
#   docker compose --profile geo-setup run --rm geo-import   # -> PostGIS
#   docker compose --profile geo-setup run --rm osrm-prep    # routing graph
# Skip it and the app still starts: lookups report the directory unavailable,
# distances fall back to straight-line, and the emergency number still works.
#
# Needs OPENAI_API_KEY in .env. To run without spending tokens, add these two
# lines to .env and start with the mock profile:
#   OPENAI_API_KEY=mock
#   OPENAI_BASE_URL=http://mock-llm:9100/v1
#   docker compose --profile mock up --build --scale app=3
# The mock calls tools like a real model (2-4 calls per turn), so the full
# stack is exercised. Break it mid-run with:
#   curl -XPOST localhost:9100/admin/fault -d '{"mode":"down"}'

services:
  redis:
    image: redis:7-alpine
    # Sessions/rate limits are disposable by design (TTLs), so no persistence;
    # evict least-recently-used keys rather than erroring if memory fills.
    command: [ "redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      retries: 30

  postgres:
    # PostGIS on the same Postgres 16 major as before, so an existing pgdata
    # volume upgrades in place. One DB holds both the checkpointer and the
    # provider directory (schema geo); GEO_DATABASE_URL can split them later.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: careroute
      POSTGRES_PASSWORD: careroute
      POSTGRES_DB: careroute
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "careroute" ]
      interval: 2s
      retries: 30

  # Runs ONCE before the replicas start — the same pattern as production,
  # where N replicas booting together must not all race to migrate.
  migrate:
    build: .
    command: [ "python", "checkpoints.py", "migrate" ]
    env_file: .env
    environment: &shared_env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://careroute:careroute@postgres:5432/careroute
      CAREROUTE_REQUIRE_SHARED_STATE: "1"
      CAREROUTE_PG_AUTO_MIGRATE: "0"
      # Self-hosted map stack (overrides anything in .env).
      USE_REAL_PROVIDERS: osm
      OSM_SOURCE: postgis
      OSRM_BASE_URL: http://osrm:5000
      NOMINATIM_URL: http://nominatim:8080
    depends_on:
      postgres: { condition: service_healthy }

  app:
    build: .
    env_file: .env
    environment: *shared_env
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')" ]
      interval: 5s
      retries: 10

  lb:
    image: nginx:1.27-alpine
    ports: [ "8000:80" ]
    volumes: [ "./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    depends_on:
      app: { condition: service_healthy }

  # ---- Self-hosted map data (step 2) ------------------------------------
  # Road distances. No depends_on from the app on purpose: routing.py falls
  # back to straight-line distance when OSRM is down, and the app should
  # start (degraded) rather than wait on it.
  osrm:
    # OSRM publishes release images with a platform suffix; a bare vX.Y.Z tag
    # is not reliably published. On an ARM machine (Apple silicon) use the
    # -arm64-debian variant here and in osrm-prep below.
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-debian
    command: [ "osrm-routed", "--algorithm", "mld", "/data/osm/karnataka.osrm" ]
    volumes: [ "./data/osm:/data/osm:ro" ]
    ports: [ "127.0.0.1:5000:5000" ] # for manual checks only
    restart: unless-stopped

  # Geocoding (place name -> lat/lng) and reverse geocoding (-> country, for
  # the emergency number). The FIRST start imports the extract into its own
  # database (persisted in nominatim-data); expect that to take a while.
  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_PATH: /nominatim/data/karnataka.osm.pbf
      IMPORT_WIKIPEDIA: "false"
      THREADS: "4"
    volumes:
      - ./data/osm:/nominatim/data
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    ports: [ "127.0.0.1:8080:8080" ] # for manual checks only
    restart: unless-stopped

  # One-time setup jobs:  docker compose --profile geo-setup run --rm <job>
  geo-fetch:
    profiles: [ "geo-setup" ]
    build: ./geo
    command: [ "/geo/fetch_extract.sh" ]
    volumes: [ "./data/osm:/data/osm" ]

  geo-import:
    profiles: [ "geo-setup" ]
    build: ./geo
    command: [ "/geo/import.sh" ]
    environment:
      GEO_DATABASE_URL: postgresql://careroute:careroute@postgres:5432/careroute
    volumes: [ "./data/osm:/data/osm:ro" ]
    depends_on:
      postgres: { condition: service_healthy }

  osrm-prep:
    profiles: [ "geo-setup" ]
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-debian
    entrypoint: [ "sh", "/geo/osrm_prep.sh" ]
    volumes: [ "./data/osm:/data/osm", "./geo:/geo:ro" ]

  # Fake OpenAI for load tests: scripted tool calls, 0.8-2 s latency, fault
  # switch at /admin/fault, call + token counts at /admin/stats.
  mock-llm:
    profiles: [ "mock" ]
    build: .
    command: [ "uvicorn", "mock_llm:app", "--host", "0.0.0.0", "--port", "9100" ]
    environment:
      MOCK_LLM_MODE: agent
      MOCK_LLM_LATENCY_MIN_S: "0.8"
      MOCK_LLM_LATENCY_MAX_S: "2.0"
    ports: [ "127.0.0.1:9100:9100" ] # so a load test can flip faults mid-run

  # Prune idle conversations every 15 min (in Azure: a Container Apps Job).
  pruner:
    build: .
    env_file: .env
    environment: *shared_env
    entrypoint: [ "sh", "-c", "while true; do python checkpoints.py prune --idle-hours 2; sleep 900; done" ]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  nominatim-data:
